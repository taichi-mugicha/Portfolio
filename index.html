<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Taichi Ito Portfolio</title>

<!-- 和文フォント：Noto Sans JP（Google Fonts） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================================================
     GREETING SPLASH
     調整可能な値は :root の変数に集約。詳細は splash-handoff.md 参照。
     ============================================================ -->
<style>
  :root {
    --splash-bg: #fff;            /* このモックの --bg と揃えている */
    --splash-ink: #1f2430;        /* 見出し文字色 */
    --wave-duration: 2.1s;        /* 手を振る速さ */
    --wave-delay: .55s;           /* 見出しが出てから振り始めるまでの"間" */
    --rise-duration: .6s;         /* 見出しがふわっと現れる速さ */
    --fade-duration: .5s;         /* スプラッシュが消えるフェード速さ */
    --ease-out: cubic-bezier(.22,.61,.36,1);
  }

  html.is-loading, html.is-loading body { overflow: hidden; }

  .splash {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    background: var(--splash-bg);
    z-index: 99999;
    transition: opacity var(--fade-duration) var(--ease-out),
                visibility var(--fade-duration) var(--ease-out);
  }
  .splash.is-dismissed { opacity: 0; visibility: hidden; }

  .splash__greeting {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    font-size: clamp(30px, 8vw, 52px);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--splash-ink);
    opacity: 0;
    transform: translateY(8px);
    animation: splash-rise var(--rise-duration) var(--ease-out) forwards;
  }

  .splash__hand {
    display: inline-block;
    transform-origin: 75% 80%;
    animation: splash-wave var(--wave-duration) var(--ease-out) var(--wave-delay) 1 both;
  }

  @keyframes splash-rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes splash-wave {
    0%   { transform: rotate(0deg); }
    12%  { transform: rotate(14deg); }
    32%  { transform: rotate(-9deg); }
    52%  { transform: rotate(12deg); }
    72%  { transform: rotate(-15deg); }
    100% { transform: rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .splash__greeting { animation: none; opacity: 1; transform: none; }
    .splash__hand { animation: none; }
  }
</style>
<noscript><style>.splash{ display:none !important; }</style></noscript>

<style>
  :root{
    --ink:#0a0a0a; /* 装飾の塗り（ドット・タブの下線バーなど）専用。テキスト色は --text-main / --text-sub を使う */
    --line:#e5e5e5;
    --bg:#ffffff;
    --ph:#ececec;
    --sheet-radius:24px;
    --ease:cubic-bezier(.22,1,.36,1);
    --content-pad:16px; /* カルーセル・年タブ・グリッドが共有する左右余白。全ブレークポイント共通で16pxに固定する */
    --text-main:rgba(0,0,0,.96); /* メインテキスト */
    --text-sub:rgba(0,0,0,.54);  /* サブテキスト */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#dcdcdc;color:var(--text-main);
    /* 和文は Noto Sans JP（Google Fonts、<head>で読み込み）。
       読み込めない環境では端末のゴシックにフォールバックする。 */
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    overflow:hidden;height:100%;width:100%;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== TOP page ===== */
  .top{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .top__inner{max-width:430px;margin:0 auto;padding:14px var(--content-pad) 80px}
  .top__inner{padding:calc(14px + env(safe-area-inset-top)) calc(var(--content-pad) + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(var(--content-pad) + env(safe-area-inset-left))}
  .nav{display:flex;align-items:center;justify-content:space-between;height:52px}
  /* ロゴが入る想定のプレースホルダー。Figma（node 601:508）の"Ta"を参考にしたサイズ・字間。 */
  .nav__logo{font-size:20px;font-weight:600;line-height:1.05;letter-spacing:-.02em;color:var(--text-main)}
  .menu{width:28px;height:18px;display:flex;flex-direction:column;justify-content:space-between}
  .menu::before,.menu::after{content:"";display:block;height:1.6px;background:#0a0a0a}
  .menu::before{box-shadow:0 8px 0 0 #0a0a0a}

  /* 作品グリッドだけ左右余白を8pxに。--content-pad（16px）との差分を負のマージンで打ち消す。 */
  .grid{display:grid;grid-template-columns:1fr;gap:28px;margin:0 -8px}
  .card{cursor:pointer;user-select:none}
  .card__thumb{
    width:100%;aspect-ratio:4/3;background:var(--ph);border-radius:4px;position:relative;overflow:hidden;
    transition:transform .25s var(--ease);
  }
  .card:active .card__thumb{transform:scale(.985)}
  .card__thumb svg,.card__thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card__meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;gap:8px}
  .card__title{font-weight:600;font-size:16px;line-height:1.5;letter-spacing:.05em;color:var(--text-main)}
  .card__tag{font-size:12px;line-height:1.5;color:var(--text-sub)}
  .card__num{font-size:11px;line-height:1.5;color:var(--text-sub);font-variant-numeric:tabular-nums}

  /* ===== Hero carousel（Figma node 553:194 を参考） ===== */
  /* 画像は16:9でcover（切り抜きあり）。キャプションは画像に重ねず、下の専用バンドに置く。
     .top__inner の左右パディング（--content-pad）を打ち消す負のマージンで画面幅いっぱいに広げる
     （角丸なし＝端まで塗り切る）。 */
  .hero-carousel{
    position:relative;overflow:hidden;background:#f5f5f5;
    margin:0 calc(var(--content-pad) * -1);
  }
  .hero-carousel__track{display:flex;align-items:flex-start;transition:transform .45s var(--ease)}
  .hero-carousel__track.is-dragging{transition:none}
  .hero-carousel__slide{flex:0 0 100%;display:flex;flex-direction:column;cursor:pointer;background:#f5f5f5}
  .hero-carousel__media{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#f5f5f5}
  .hero-carousel__media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* 画像の下に続くバンド。キャプションの「バッジ」はここに左寄せで置く。
     スライドが表示されるたびに clip-path で左から伸びてくる（ワイプイン）アニメーションを掛け直す
     （JS側は is-collapsed の付け外しでtransitionを再トリガーする）。テキストは拡大縮小されないので
     scaleX と違って文字がつぶれない。 */
  .hero-carousel__band{width:100%;background:#f4f4f4;display:flex;align-items:flex-end;padding:8px 0 16px;min-height:84px;box-sizing:border-box}
  .hero-carousel__badge{
    background:linear-gradient(to right,#ed23a3,#ff5887 50%,#ee7c54);
    color:#fff;display:flex;flex-direction:column;gap:5px;
    padding:8px 16px;border-radius:0;
    clip-path:inset(0 0 0 0);transition:clip-path .55s var(--ease);
  }
  .hero-carousel__slide.is-collapsed .hero-carousel__badge{clip-path:inset(0 100% 0 0);transition:none}
  .hero-carousel__title{font-size:10px;line-height:1.5;letter-spacing:.02em;font-weight:600}
  .hero-carousel__concept{font-size:14px;line-height:1.5;letter-spacing:.02em;font-weight:600}

  .hero-dots{display:flex;gap:5px;align-items:center;justify-content:flex-start;padding:4px 6px;margin-top:16px}
  .hero-dots span{width:5px;height:5px;border-radius:2.5px;background:#d3d3d3;transition:background .2s,width .2s;cursor:pointer}
  .hero-dots span.is-active{background:var(--ink);width:18px;border-radius:99px}

  /* ===== Year tabs ===== */
  /* 各タブは可読性のため padding:8px を持つが、そのぶん最初のタブの文字が
     コンテンツ幅（.top__innerの左パディング = --content-pad、常に16px）より右に寄ってしまう。
     行全体を calc() で左へ寄せ、カルーセルやグリッドと同じ16pxの余白感で「2025」が揃うようにする。 */
  .year-tabs{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:40px 0 0 calc(16px - var(--content-pad) - 8px)}
  .year-tabs::-webkit-scrollbar{display:none}
  .year-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;background:none;border:none;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .year-tab__label{font-size:16px;font-weight:400;letter-spacing:.02em;color:var(--text-sub);white-space:nowrap}
  .year-tab__bar{height:2px;width:100%;min-width:36px;background:var(--line);opacity:0}
  .year-tab.is-active .year-tab__label{font-weight:600;color:var(--text-main)}
  .year-tab.is-active .year-tab__bar{background:var(--ink);opacity:1}

  /* その年の作品を一言で紹介するテキスト。タブ切り替えごとにJSでディゾルブ（フェード＋ふわっと浮かび上がる）
     表示に切り替える。 */
  .year-note{
    font-size:12px;line-height:1.5;color:var(--text-sub);margin:0 0 16px;
    opacity:1;transform:translateY(0);transition:opacity .5s var(--ease),transform .5s var(--ease);
  }
  .year-note.is-fading{opacity:0;transform:translateY(6px)}

  /* ===== Footer ===== */
  .top-footer{display:flex;flex-direction:column;gap:4px;padding:32px 0 0}
  .top-footer__name{font-weight:700;font-size:12px;color:var(--text-main)}
  .top-footer__name::before{content:"■";margin-right:6px}
  .top-footer__meta{font-size:11px;color:var(--text-sub)}

  /* ===== Backdrop ===== */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.36);
    opacity:0;pointer-events:none;transition:opacity .32s var(--ease);z-index:50;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  body.sheet-open .backdrop{opacity:1;pointer-events:auto}

  /* ===== Sheet (modal bottom sheet — Figma node 391:1676) ===== */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;
    /* vhはURLバーが隠れた最大高さを指すため、Android ChromeでURLバー表示中に
       上端がはみ出して隠れる。dvhで実際の表示領域に追従させる（vhは非対応時の保険）。 */
    height:96vh;
    height:96dvh;
    background:var(--bg);
    border-top-left-radius:var(--sheet-radius);
    border-top-right-radius:var(--sheet-radius);
    box-shadow:0 -18px 60px rgba(0,0,0,.25);
    z-index:60;
    transform:translateY(100%);
    transition:transform .42s var(--ease);
    overflow:hidden;
    display:flex;flex-direction:column;
    will-change:transform;
    max-width:560px;margin:0 auto;
  }
  body.sheet-open .sheet{transform:translateY(0)}
  body.sheet-dragging .sheet{transition:none}
  body.sheet-dragging .backdrop{transition:none}

  .sheet__head{
    flex:0 0 auto;
    padding:8px 0 8px;
    display:flex;flex-direction:column;align-items:center;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:relative;z-index:2;
    touch-action:none;
  }
  .handle{
    width:38px;height:4px;border-radius:99px;background:#d6d6d6;margin:0 0 8px;
  }
  .sheet__nav{
    width:100%;display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:8px;
    padding:0 20px 16px;
    padding:0 calc(20px + env(safe-area-inset-right)) 16px calc(20px + env(safe-area-inset-left));
  }
  .sheet__title{font-weight:600;font-size:14px;text-align:center;letter-spacing:.05em;color:var(--text-main)}
  .sheet__title small{display:block;font-weight:600;font-size:11px;letter-spacing:0;color:var(--text-sub);margin-bottom:2px}
  .icon-btn{
    width:32px;height:32px;border:none;background:transparent;color:var(--text-main);
    display:inline-flex;align-items:center;justify-content:center;border-radius:16px;
    cursor:pointer;font-size:18px;line-height:1;
  }
  .icon-btn:active{background:#f1f1f1}

  /* Pager (swipe area) */
  .pager{
    flex:1 1 auto;position:relative;overflow:hidden;
    touch-action:pan-y;
  }
  .pager__track{
    position:absolute;inset:0;display:flex;
    will-change:transform;
  }
  .pager__track.is-animating{transition:transform .38s var(--ease)}
  .slide{
    flex:0 0 100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px 20px 60px;
    padding:24px calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .slide::-webkit-scrollbar{display:none}

  /* ---- Hero + title + meta ---- */
  /* 画面幅いっぱい：.slide の上・左右パディングを打ち消す */
  .s-hero{aspect-ratio:335/384;background:var(--ph);overflow:hidden;margin:-24px calc(-20px - env(safe-area-inset-right)) 24px calc(-20px - env(safe-area-inset-left))}
  .s-hero svg,.s-hero img{width:100%;height:100%;display:block;object-fit:cover}
  .s-title{font-size:24px;line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:0 0 8px;word-break:break-word;color:var(--text-main)}
  .s-meta{font-size:11px;line-height:1.5;color:var(--text-sub)}
  .s-meta .period{margin:0}
  .s-headgroup{margin-bottom:40px}

  /* ---- section blocks ---- */
  .s-section{margin-bottom:40px}
  .s-section:last-child{margin-bottom:0}
  .section-label{font-size:11px;line-height:1.5;letter-spacing:0;color:var(--text-main);font-weight:600;margin:0 0 16px}

  .s-overview{font-size:14px;line-height:1.65;letter-spacing:.05em;color:var(--text-main);margin:20px 0 0}

  /* POINT OF VIEW — Figma node 391:2064 */
  .pov-block{background:#f3f3f3;border-radius:8px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:8px}
  .pov-block + .pov-block{margin-top:16px}
  .pov-block .section-label{margin:0}
  .design-block .section-label{margin-bottom:8px}
  .pov-h{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.02em;color:var(--text-main);margin:0;word-break:break-word}
  .pov-p{font-size:14px;line-height:1.65;letter-spacing:.05em;color:var(--text-main);margin:0}

  .design-block,.process-block{margin-bottom:32px}
  .design-block:last-child,.process-block:last-child{margin-bottom:0}
  .design-h{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3;color:var(--text-main);margin:0 0 8px}
  .process-h{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.3;color:var(--text-main);margin:0 0 8px}
  .block-p{font-size:14px;line-height:1.65;letter-spacing:.05em;color:var(--text-main);margin:0}
  /* 画像（キャプション）の後に続く本文は少し離す */
  .sec-img + .block-p,.sec-caption + .block-p{margin-top:12px}
  .sec-img{width:100%;background:var(--ph);border-radius:2px;overflow:hidden;margin-top:8px}
  .sec-img svg{width:100%;height:auto;aspect-ratio:772/480;display:block}
  .sec-img img{width:100%;height:auto;display:block}
  .sec-caption{font-size:11px;line-height:1.5;color:var(--text-sub);margin:6px 2px 0}

  .outcome-list{display:flex;flex-direction:column;gap:16px}
  .outcome-row{background:#fafafa;border-radius:6px;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
  .outcome-row .n{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--text-main);white-space:nowrap;font-variant-numeric:tabular-nums}
  .outcome-row .l{font-size:12px;line-height:1.5;color:var(--text-sub);text-align:right}

  .s-divider{height:1px;background:#e0e0e0;margin:0 0 40px}

  .related-list{display:flex;gap:16px;align-items:flex-start}
  .related-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;cursor:pointer;user-select:none}
  .related-thumb{width:100%;height:96px;background:var(--ph);border-radius:2px;overflow:hidden}
  .related-thumb svg,.related-thumb img{width:100%;height:100%;display:block;object-fit:cover}
  .related-title{font-size:14px;line-height:1.5;letter-spacing:.05em;color:var(--text-main);padding:0 4px;word-break:break-word}

  .swipe-hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:11px;line-height:1.5;color:var(--text-sub);letter-spacing:0;background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:7px 12px;border-radius:99px;border:1px solid var(--line);
    pointer-events:none;opacity:0;transition:opacity .35s var(--ease);
    z-index:3;
  }
  body.sheet-open .swipe-hint{opacity:1;animation:fadeOut .4s var(--ease) 2.6s forwards}
  @keyframes fadeOut{to{opacity:0}}
  .swipe-hint .for-pointer{display:none}

  /* ============================================================
     RESPONSIVE
     ここより上がモバイル（〜639px）の正。以下は幅が広がったときの
     上書きだけを書く。モバイルの見た目を変える修正は上のブロックへ。
     ============================================================ */

  /* ---- 640px〜：タブレット。一覧を2カラムに ---- */
  @media (min-width:640px){
    .top__inner{
      max-width:760px;
      padding:calc(20px + env(safe-area-inset-top)) calc(var(--content-pad) + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(var(--content-pad) + env(safe-area-inset-left));
    }
    .grid{grid-template-columns:repeat(2,1fr);gap:36px 24px}
  }

  /* ---- 1024px〜：デスクトップ。3カラム ---- */
  @media (min-width:1024px){
    .top__inner{
      max-width:1100px;
      padding:calc(24px + env(safe-area-inset-top)) calc(var(--content-pad) + env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) calc(var(--content-pad) + env(safe-area-inset-left));
    }
    .nav{height:60px}
    .grid{grid-template-columns:repeat(3,1fr);gap:44px 28px}
  }

  /* ---- シート：広い画面では本文の行長が伸びすぎないよう幅を抑える ---- */
  @media (min-width:768px){
    .sheet{max-width:720px}
    .slide{
      padding:32px calc(48px + env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) calc(48px + env(safe-area-inset-left));
    }
    .s-hero{aspect-ratio:16/10;margin:-32px calc(-48px - env(safe-area-inset-right)) 32px calc(-48px - env(safe-area-inset-left))}
    .related-thumb{height:120px}
  }

  /* ---- 1024px〜：下に貼り付かせず、中央に浮かぶダイアログとして扱う ---- */
  @media (min-width:1024px){
    .sheet{
      max-width:760px;
      height:min(88dvh,900px);
      bottom:32px;
      border-radius:20px;
      /* 閉じている間、bottomの余白ぶんも下へ逃がす（24pxの帯が覗くのを防ぐ） */
      transform:translateY(calc(100% + 32px));
    }
  }

  /* ---- マウス環境：タップ前提のUIに hover の手がかりを足す ---- */
  @media (hover:hover) and (pointer:fine){
    .card__thumb{transition:transform .25s var(--ease),opacity .25s var(--ease)}
    .card:hover .card__thumb{opacity:.86}
    .icon-btn:hover{background:#f4f4f4}
    .related-thumb{transition:opacity .25s var(--ease)}
    .related-item:hover .related-thumb{opacity:.86}
    .backdrop{cursor:pointer}
    .pager{cursor:grab}
    .pager:active{cursor:grabbing}
    .hero-carousel{cursor:grab}
    .hero-carousel:active{cursor:grabbing}
    .swipe-hint .for-touch{display:none}
    .swipe-hint .for-pointer{display:inline}
  }
</style>
</head>
<body>

<div class="splash" id="splash" role="status" aria-live="polite">
  <div class="splash__greeting">
    <span>こんにちは</span>
    <span class="splash__hand" aria-hidden="true">👋</span>
  </div>
</div>

<!-- ============ TOP ============ -->
<div class="top" id="top">
  <div class="top__inner">
    <div class="nav">
      <div class="nav__logo">Ta</div>
      <div class="menu" aria-label="menu"></div>
    </div>

    <div class="hero-carousel" id="heroCarousel">
      <div class="hero-carousel__track" id="heroTrack"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>

    <div class="year-tabs" id="yearTabs"></div>
    <p class="year-note" id="yearNote"></p>

/* ============== THUMB ART ============== */
function thumbSvg(hue,seed){
  const c1=`hsl(${hue} 8% 88%)`;
  const c2=`hsl(${hue} 12% 78%)`;
  const c3=`hsl(${hue} 22% 62%)`;
  return `
  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="${c1}"/>
    <rect x="0" y="${60+seed*8}" width="400" height="${100-seed*6}" fill="${c2}"/>
    <circle cx="${80+seed*40}" cy="${180-seed*10}" r="${44+seed*4}" fill="${c3}" opacity=".82"/>
    <rect x="${220-seed*10}" y="${40+seed*6}" width="${120+seed*6}" height="${120+seed*4}" fill="${c3}" opacity=".55"/>
  </svg>`;
}

/* ============== HERO CAROUSEL（全作品を自動でめぐる） ============== */
const heroCarouselEl=document.getElementById('heroCarousel');
const heroTrack=document.getElementById('heroTrack');
const heroDots=document.getElementById('heroDots');
/* キャプション2行目の「コンセプト」。POINT OF VIEW（コンセプト節）の見出しをそのまま流用する。
   pov未設定の作品（初期に作った作品）はカテゴリタグで代用する。 */
function conceptOf(w){
  return (w.pov && w.pov[0]) ? w.pov[0].heading : w.tags.join('・');
}
/* カルーセルは全作品ではなく、ピックアップした5作品（pickup:true）だけを表示する。
   スライドの並び順(pos)とWORKS内の通し番号(i)は別物なので、シートを開く時だけ元のiを使う。 */
const HERO_WORKS = WORKS.map((w,i)=>({w,i})).filter(x=>x.w.pickup);
HERO_WORKS.forEach(({w,i},pos)=>{
  const slide=document.createElement('div');
  slide.className='hero-carousel__slide';
  const heroImg = w.carouselImg || `01.${w.ext||'png'}`; /* カルーセル専用画像が無ければ01を使う */
  slide.innerHTML = `
    <div class="hero-carousel__media"><img src="works/images/${w.slug}/${heroImg}" alt=""></div>
    <div class="hero-carousel__band">
      <div class="hero-carousel__badge">
        <div class="hero-carousel__title">${w.title}</div>
        <div class="hero-carousel__concept">${conceptOf(w)}</div>
      </div>
    </div>`;
  slide.addEventListener('click',()=>{
    if(hcSuppressClick){hcSuppressClick=false;return;}
    openSheet(i);
  });
  heroTrack.appendChild(slide);
  const dot=document.createElement('span');
  dot.dataset.i=pos;
  heroDots.appendChild(dot);
});
let heroIndex=0,heroTimer=null,heroWidth=0;
function measureHero(){heroWidth=heroCarouselEl.clientWidth}
window.addEventListener('resize',measureHero);
measureHero();
/* 座布団（グラデーション）とキャプションを、画面左から伸びてくるアニメーションで毎回再表示する。
   スライドは常にDOM上に存在し続ける（横スライドで見せているだけ）ため、アクティブになるたびに
   is-collapsed を付け外して transition を再トリガーする。 */
function playHeroReveal(i){
  const slide=heroTrack.children[i];
  if(!slide)return;
  slide.classList.add('is-collapsed');
  void slide.offsetWidth;
  slide.classList.remove('is-collapsed');
}
function setHeroIndex(i){
  heroIndex=(i+HERO_WORKS.length)%HERO_WORKS.length;
  heroTrack.style.transform=`translate3d(${-heroIndex*100}%,0,0)`;
  [...heroDots.children].forEach((d,j)=>d.classList.toggle('is-active',j===heroIndex));
  playHeroReveal(heroIndex);
}
function restartHeroTimer(){
  clearInterval(heroTimer);
  heroTimer=setInterval(()=>setHeroIndex(heroIndex+1),4500);
}
heroDots.addEventListener('click',e=>{
  const dot=e.target.closest('span'); if(!dot) return;
  setHeroIndex(Number(dot.dataset.i));
  restartHeroTimer();
});
setHeroIndex(0);
restartHeroTimer();

/* ---- カルーセルのスワイプ（シートのページャーと同じ考え方：縦スクロールとの
   衝突を避けるため、動き始めの6pxで横方向のドラッグだけ確定させる） ---- */
let hcX=0,hcY=0,hcDX=0,hcDY=0,hcStartT=0,hcDir=null,hcDragging=false,hcSuppressClick=false;
function heroDragStart(x,y){
  measureHero();
  hcX=x;hcY=y;hcDX=0;hcDY=0;hcDir=null;hcDragging=true;hcStartT=performance.now();
  heroTrack.classList.add('is-dragging');
  clearInterval(heroTimer);
}
function heroDragMove(x,y,ev){
  if(!hcDragging)return;
  hcDX=x-hcX;hcDY=y-hcY;
  if(!hcDir && (Math.abs(hcDX)>6||Math.abs(hcDY)>6)) hcDir=Math.abs(hcDX)>Math.abs(hcDY)?'x':'y';
  if(hcDir==='x'){
    if(ev&&ev.cancelable)ev.preventDefault();
    heroTrack.style.transform=`translate3d(${-heroIndex*heroWidth+hcDX}px,0,0)`;
  }
}
function heroDragEnd(){
  if(!hcDragging)return;hcDragging=false;
  heroTrack.classList.remove('is-dragging');
  if(hcDir==='x'){
    const v=hcDX/(performance.now()-hcStartT);
    const threshold=heroWidth*0.18;
    if(hcDX<-threshold||v<-0.4){hcSuppressClick=true;setHeroIndex(heroIndex+1);}
    else if(hcDX>threshold||v>0.4){hcSuppressClick=true;setHeroIndex(heroIndex-1);}
    else setHeroIndex(heroIndex);
  }
  restartHeroTimer();
}
heroCarouselEl.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  heroDragStart(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
heroCarouselEl.addEventListener('touchmove',e=>{
  heroDragMove(e.touches[0].clientX,e.touches[0].clientY,e);
},{passive:false});
heroCarouselEl.addEventListener('touchend',heroDragEnd);
heroCarouselEl.addEventListener('mousedown',e=>{
  heroDragStart(e.clientX,e.clientY);
  const mm=ev=>heroDragMove(ev.clientX,ev.clientY);
  const mu=()=>{heroDragEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
});

const yearNoteEl=document.getElementById('yearNote');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let yearNoteTimer=null;
/* いまの文言をフェードアウトしてから差し替え、ふわっと浮かび上がらせて表示する。
   initial:true は初回表示用で、フェードアウトのステップを飛ばして浮かび上がりだけ行う。 */
function showYearNote(text,{initial=false}={}){
  clearTimeout(yearNoteTimer);
  if(reduceMotion){ yearNoteEl.textContent=text||''; return; }
  if(initial){
    yearNoteEl.textContent=text||'';
    yearNoteEl.classList.add('is-fading');
    requestAnimationFrame(()=>requestAnimationFrame(()=>yearNoteEl.classList.remove('is-fading')));
    return;
  }
  yearNoteEl.classList.add('is-fading');
  yearNoteTimer=setTimeout(()=>{
    yearNoteEl.textContent=text||'';
    void yearNoteEl.offsetWidth; /* reflowを挟んでフェードインのtransitionを確実に再発火させる */
    yearNoteEl.classList.remove('is-fading');
  },260);
}

function sectionImg(slug,hue,seed,img){

  });

function setIndex(i,{animate=true,resetScroll}={}){
  const prevIndex=currentIndex;
  currentIndex=Math.max(0,Math.min(WORKS.length-1,i));
  measure();
  track.classList.toggle('is-animating',animate);
  track.style.transform=`translate3d(${-currentIndex*pagerWidth}px,0,0)`;
  caseLabel.textContent=`CASE 0${currentIndex+1} / 0${WORKS.length}`;
  caseTitle.textContent=WORKS[currentIndex].title;
  // 作品が変わったときだけスクロールを戻す。
  // タップ（Androidの擬似マウスイベント）やしきい値未満のスワイプでも
  // setIndexは呼ばれるので、無条件に戻すと読んでいる途中で先頭に飛んでしまう。
  if(resetScroll ?? (currentIndex!==prevIndex)){
    const slide=track.children[currentIndex];
    if(slide) slide.scrollTop=0;
  }
}

function openSheet(i){
  measure();
  setIndex(i,{animate:false,resetScroll:true});
  document.body.classList.add('sheet-open');
  sheet.setAttribute('aria-hidden','false');
}
function closeSheet(){
  document.body.classList.remove('sheet-open');
  sheet.setAttribute('aria-hidden','true');
}

prevBtn.addEventListener('click',()=>setIndex((currentIndex-1+WORKS.length)%WORKS.length));
nextBtn.addEventListener('click',()=>setIndex((currentIndex+1)%WORKS.length));
backdrop.addEventListener('click',closeSheet);

/* ============== Horizontal swipe (pager) ============== */
let hx=0,hy=0,hdx=0,hdy=0,hStartT=0,hDir=null,hDragging=false;
pager.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  hx=e.touches[0].clientX;hy=e.touches[0].clientY;hdx=0;hdy=0;hDir=null;hDragging=true;
  hStartT=performance.now();
  track.classList.remove('is-animating');
},{passive:true});
pager.addEventListener('touchmove',e=>{
  if(!hDragging)return;
  hdx=e.touches[0].clientX-hx;
  hdy=e.touches[0].clientY-hy;
  if(!hDir){
    if(Math.abs(hdx)>6||Math.abs(hdy)>6){
      hDir=Math.abs(hdx)>Math.abs(hdy)?'x':'y';
    }
  }
  if(hDir==='x'){
    e.preventDefault();
    let x=-currentIndex*pagerWidth+hdx;
    // resistance at edges
    if((currentIndex===0&&hdx>0)||(currentIndex===WORKS.length-1&&hdx<0)){
      x=-currentIndex*pagerWidth+hdx*0.35;
    }
    track.style.transform=`translate3d(${x}px,0,0)`;
  }
},{passive:false});
pager.addEventListener('touchend',()=>{
  if(!hDragging)return;hDragging=false;
  if(hDir!=='x'){return;}
  const dt=performance.now()-hStartT;
  const v=hdx/dt; // px/ms
  const threshold=pagerWidth*0.18;
  let next=currentIndex;
  if(hdx<-threshold || v<-0.4) next=currentIndex+1;
  else if(hdx>threshold || v>0.4) next=currentIndex-1;
  setIndex(next);
});

/* ============== Vertical drag (close sheet) — only on header/handle ============== */
let vy=0,vdy=0,vDragging=false,vStartT=0;
function onDragStart(y){
  vy=y;vdy=0;vDragging=true;vStartT=performance.now();
  document.body.classList.add('sheet-dragging');
}
function onDragMove(y){
  if(!vDragging)return;
  vdy=Math.max(0,y-vy);
  sheet.style.transform=`translateY(${vdy}px)`;
  backdrop.style.opacity=Math.max(0,1-vdy/400);
}
function onDragEnd(){
  if(!vDragging)return;vDragging=false;
  document.body.classList.remove('sheet-dragging');
  sheet.style.transform='';
  backdrop.style.opacity='';
  const dt=performance.now()-vStartT;
  const v=vdy/dt;
  if(vdy>140 || v>0.6) closeSheet();
}
sheetHead.addEventListener('touchstart',e=>{onDragStart(e.touches[0].clientY)},{passive:true});
sheetHead.addEventListener('touchmove',e=>{onDragMove(e.touches[0].clientY);e.preventDefault()},{passive:false});
sheetHead.addEventListener('touchend',onDragEnd);
sheetHead.addEventListener('mousedown',e=>{onDragStart(e.clientY);
  const mm=ev=>onDragMove(ev.clientY);
  const mu=()=>{onDragEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
});

/* desktop keyboard helpers */
window.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('sheet-open'))return;
  if(e.key==='ArrowRight') setIndex(currentIndex+1<WORKS.length?currentIndex+1:currentIndex);
  if(e.key==='ArrowLeft')  setIndex(currentIndex-1>=0?currentIndex-1:currentIndex);
  if(e.key==='Escape') closeSheet();
});

/* desktop: also allow mouse-drag swipe on pager */
let mDown=false,mx=0,mdx=0,mStartT=0;
pager.addEventListener('mousedown',e=>{
  mDown=true;mx=e.clientX;mdx=0;mStartT=performance.now();
  track.classList.remove('is-animating');
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!mDown)return;
  mdx=e.clientX-mx;
  let x=-currentIndex*pagerWidth+mdx;
  if((currentIndex===0&&mdx>0)||(currentIndex===WORKS.length-1&&mdx<0)) x=-currentIndex*pagerWidth+mdx*0.35;
  track.style.transform=`translate3d(${x}px,0,0)`;
});
window.addEventListener('mouseup',()=>{
  if(!mDown)return;mDown=false;
  const dt=performance.now()-mStartT;
  const v=mdx/dt;
  const threshold=pagerWidth*0.18;
  let next=currentIndex;
  if(mdx<-threshold || v<-0.4) next=currentIndex+1;
  else if(mdx>threshold || v>0.4) next=currentIndex-1;
  setIndex(next);
});

/* ============== Resize ==============
   ページャーの位置は px 換算で持っているため、幅が変わると現在のスライドが
   ずれる。ブレークポイントをまたぐリサイズや端末回転で追従させる。 */
let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    measure();
    track.classList.remove('is-animating');
    track.style.transform=`translate3d(${-currentIndex*pagerWidth}px,0,0)`;
  },120);
});

measure();
</script>

<script>
  (function () {
    var html = document.documentElement;
    var splash = document.getElementById('splash');
    if (!splash) return;

    html.classList.add('is-loading');

    var dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      splash.classList.add('is-dismissed');
      html.classList.remove('is-loading');
      splash.addEventListener('transitionend', function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, { once: true });
    }

    // 初回訪問のみ最低 1.2s 見せる(挨拶が一瞬すぎて見えない問題への対応)。
    // 再訪時は sessionStorage を見て即座に消す
    var MIN = sessionStorage.getItem('seen-hi') ? 0 : 1200;
    var startedAt = Date.now();
    function dismissRespectingMin() {
      var wait = Math.max(0, MIN - (Date.now() - startedAt));
      setTimeout(function () {
        dismiss();
        sessionStorage.setItem('seen-hi', '1');
      }, wait);
    }

    if (document.readyState === 'complete') {
      dismissRespectingMin();
    } else {
      window.addEventListener('load', dismissRespectingMin);
    }

    setTimeout(dismiss, 5000);
  })();
</script>
