<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>作品詳細 — 伊藤太一 Portfolio</title>
<style>
  :root{
    --ink:#0a0a0a;
    --muted:#737373;
    --meta:#404040;
    --line:#e5e5e5;
    --bg:#ffffff;
    --ph:#ececec;
    --sheet-radius:24px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#dcdcdc;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    overflow:hidden;height:100%;width:100%;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== TOP page ===== */
  .top{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .top__inner{max-width:430px;margin:0 auto;padding:14px 20px 80px}
  .nav{display:flex;align-items:center;justify-content:space-between;height:52px}
  .logo{font-weight:700;font-size:15px;letter-spacing:.2px}
  .logo::before{content:"■";margin-right:6px}
  .menu{width:28px;height:18px;display:flex;flex-direction:column;justify-content:space-between}
  .menu::before,.menu::after{content:"";display:block;height:1.6px;background:#0a0a0a}
  .menu::before{box-shadow:0 8px 0 0 #0a0a0a}
  .eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--muted);margin:28px 0 14px;font-weight:500}
  .hero-h{font-weight:700;font-size:36px;line-height:1.02;letter-spacing:-.02em;margin:0 0 26px}
  .hero-h em{font-style:normal;color:var(--muted)}
  .selected-row{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px;font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:500}

  .grid{display:grid;grid-template-columns:1fr;gap:28px}
  .card{cursor:pointer;user-select:none}
  .card__thumb{
    width:100%;aspect-ratio:4/3;background:var(--ph);border-radius:6px;position:relative;overflow:hidden;
    transition:transform .25s var(--ease);
  }
  .card:active .card__thumb{transform:scale(.985)}
  .card__thumb svg,.card__thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card__meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:8px}
  .card__title{font-weight:600;font-size:16px}
  .card__tag{font-size:12px;color:var(--muted)}
  .card__num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ===== Backdrop ===== */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.36);
    opacity:0;pointer-events:none;transition:opacity .32s var(--ease);z-index:50;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  body.sheet-open .backdrop{opacity:1;pointer-events:auto}

  /* ===== Sheet (modal bottom sheet — Figma node 391:1676) ===== */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;
    height:96vh;
    background:var(--bg);
    border-top-left-radius:var(--sheet-radius);
    border-top-right-radius:var(--sheet-radius);
    box-shadow:0 -18px 60px rgba(0,0,0,.25);
    z-index:60;
    transform:translateY(100%);
    transition:transform .42s var(--ease);
    overflow:hidden;
    display:flex;flex-direction:column;
    will-change:transform;
    max-width:560px;margin:0 auto;
  }
  body.sheet-open .sheet{transform:translateY(0)}
  body.sheet-dragging .sheet{transition:none}
  body.sheet-dragging .backdrop{transition:none}

  .sheet__head{
    flex:0 0 auto;
    padding:8px 0 0;
    display:flex;flex-direction:column;align-items:center;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:relative;z-index:2;
    touch-action:none;
  }
  .handle{
    width:38px;height:4px;border-radius:99px;background:#d6d6d6;margin:0 0 8px;
  }
  .sheet__nav{
    width:100%;display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:8px;
    padding:0 20px 16px;
  }
  .sheet__title{font-weight:600;font-size:13px;text-align:center;letter-spacing:.12px;color:var(--ink)}
  .sheet__title small{display:block;font-weight:500;font-size:10px;letter-spacing:1.3px;color:var(--muted);margin-bottom:2px}
  .icon-btn{
    width:32px;height:32px;border:none;background:transparent;color:var(--ink);
    display:inline-flex;align-items:center;justify-content:center;border-radius:16px;
    cursor:pointer;font-size:18px;line-height:1;
  }
  .icon-btn:active{background:#f1f1f1}

  /* progress dots */
  .dots{display:flex;gap:5px;justify-content:center;padding:8px 0 4px}
  .dot{width:5px;height:5px;border-radius:2.5px;background:#d3d3d3;transition:background .2s,width .2s}
  .dot.is-active{background:#0a0a0a;width:18px;border-radius:99px}

  /* Pager (swipe area) */
  .pager{
    flex:1 1 auto;position:relative;overflow:hidden;
    touch-action:pan-y;
  }
  .pager__track{
    position:absolute;inset:0;display:flex;
    will-change:transform;
  }
  .pager__track.is-animating{transition:transform .38s var(--ease)}
  .slide{
    flex:0 0 100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px 20px 60px;
  }
  .slide::-webkit-scrollbar{display:none}

  /* ---- Hero + title + meta ---- */
  .s-hero{width:100%;aspect-ratio:335/384;background:var(--ph);border-radius:10px;overflow:hidden;margin-bottom:24px}
  .s-hero svg,.s-hero img{width:100%;height:100%;display:block;object-fit:cover}
  .s-title{font-size:32px;line-height:1;letter-spacing:-.02em;font-weight:700;margin:0 0 8px;word-break:break-word}
  .s-meta{font-size:11px;line-height:1.5;color:var(--meta)}
  .s-meta .period{margin:0 0 4px}
  .s-meta .tags-row{display:flex;flex-wrap:wrap;gap:12px}
  .s-headgroup{margin-bottom:40px}

  /* ---- section blocks ---- */
  .s-section{margin-bottom:40px}
  .s-section:last-child{margin-bottom:0}
  .section-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:500;margin:0 0 16px}

  .s-overview{font-size:15px;line-height:1.5;color:var(--meta);margin:0}

  .design-block,.process-block{margin-bottom:24px}
  .design-block:last-child,.process-block:last-child{margin-bottom:0}
  .design-h{font-size:22px;font-weight:600;letter-spacing:-.005em;line-height:1.3;color:var(--ink);margin:0 0 8px}
  .process-h{font-size:20px;font-weight:600;line-height:1.25;color:var(--ink);margin:0 0 8px}
  .block-p{font-size:14px;line-height:1.65;color:var(--ink);margin:0}
  .sec-img{width:100%;aspect-ratio:772/480;background:var(--ph);border-radius:10px;overflow:hidden;margin-top:8px}
  .sec-img svg,.sec-img img{width:100%;height:100%;display:block;object-fit:cover}

  .outcome-list{display:flex;flex-direction:column;gap:16px}
  .outcome-row{background:#fafafa;border-radius:6px;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
  .outcome-row .n{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .outcome-row .l{font-size:13px;color:var(--muted);text-align:right}

  .s-divider{height:1px;background:#e0e0e0;margin:0 0 40px}

  .related-list{display:flex;flex-direction:column;gap:16px}
  .related-item{cursor:pointer;user-select:none}
  .related-thumb{width:100%;height:96px;background:var(--ph);border-radius:4px;overflow:hidden;margin-bottom:8px}
  .related-thumb svg,.related-thumb img{width:100%;height:100%;display:block;object-fit:cover}
  .related-title{font-size:20px;line-height:1;letter-spacing:-.008em;color:var(--ink)}

  .swipe-hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:10.5px;color:var(--muted);letter-spacing:.6px;background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:7px 12px;border-radius:99px;border:1px solid var(--line);
    pointer-events:none;opacity:0;transition:opacity .35s var(--ease);
    z-index:3;
  }
  body.sheet-open .swipe-hint{opacity:1;animation:fadeOut .4s var(--ease) 2.6s forwards}
  @keyframes fadeOut{to{opacity:0}}
</style>
</head>

<!-- ============ TOP ============ -->

</div>

    outcome:[
      {value:"6案",label:"2回にわたり幅広いデザインを提示"},
      {value:"合意形成",label:"中立〜振り切った案で意見を引き出す"},
      {value:"リリース済み",label:"otomonieとして提供中"},
    ],
    hue:38,
  },
];

/* ============== THUMB ART ============== */
function thumbSvg(hue,seed){
  const c1=`hsl(${hue} 8% 88%)`;
  const c2=`hsl(${hue} 12% 78%)`;
  const c3=`hsl(${hue} 22% 62%)`;
  return `
  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="${c1}"/>
    <rect x="0" y="${60+seed*8}" width="400" height="${100-seed*6}" fill="${c2}"/>
    <circle cx="${80+seed*40}" cy="${180-seed*10}" r="${44+seed*4}" fill="${c3}" opacity=".82"/>
    <rect x="${220-seed*10}" y="${40+seed*6}" width="${120+seed*6}" height="${120+seed*4}" fill="${c3}" opacity=".55"/>
  </svg>`;
}

/* ============== TOP THUMBS ============== */
const grid=document.getElementById('grid');
document.getElementById('totalCount').textContent = `01 — 0${WORKS.length}`;
WORKS.forEach((w,i)=>{
  const el=document.createElement('div');
  el.className='card';
  el.dataset.i=i;
  el.innerHTML = `
    <div class="card__thumb"><img src="works/images/${w.slug}/01.png" alt=""></div>
    <div class="card__meta">
      <div>
        <div class="card__title">${w.title}</div>
        <div class="card__tag">${w.tags.join('・')}</div>
      </div>
      <div class="card__num">0${i+1} — 0${WORKS.length}</div>
    </div>`;
  el.addEventListener('click',()=>openSheet(i));
  grid.appendChild(el);
});

/* ============== SHEET ============== */
const sheet=document.getElementById('sheet');
const backdrop=document.getElementById('backdrop');
const nextBtn=document.getElementById('nextBtn');
const prevBtn=document.getElementById('prevBtn');
const sheetHead=document.getElementById('sheetHead');
const pager=document.getElementById('pager');
const track=document.getElementById('track');
const caseLabel=document.getElementById('caseLabel');
const caseTitle=document.getElementById('caseTitle');
const dotsEl=document.getElementById('dots');

let currentIndex=0;
let pagerWidth=0;
function measure(){pagerWidth=pager.clientWidth}
window.addEventListener('resize',measure);

function sectionImg(slug,hue,seed,img){
  return img ? `<img src="works/images/${slug}/${img}" alt="">` : thumbSvg(hue,seed);
}
function designHtml(sections,seed,hue,slug){
  return sections.map((s,j)=>`
    <div class="design-block">
      <h3 class="design-h">${s.heading}</h3>
      <p class="block-p">${s.body}</p>
      <div class="sec-img">${sectionImg(slug,hue,seed+j+1,s.img)}</div>
    </div>`).join('');
}
function processHtml(sections,seed,hue,slug){
  return sections.map((s,j)=>`
    <div class="process-block">
      <h3 class="process-h">${s.heading}</h3>
      <div class="sec-img">${sectionImg(slug,hue,seed+j+4,s.img)}</div>
      <p class="block-p">${s.body}</p>
    </div>`).join('');
}
function outcomeHtml(items){
  return `<div class="outcome-list">${items.map(o=>`
    <div class="outcome-row"><span class="n">${o.value}</span><span class="l">${o.label}</span></div>`).join('')}</div>`;
}
function relatedHtml(i){
  const a=WORKS[(i+1)%WORKS.length];
  const b=WORKS[(i+2)%WORKS.length];
  const idxA=(i+1)%WORKS.length, idxB=(i+2)%WORKS.length;
  return [[a,idxA],[b,idxB]].map(([w,idx])=>`
    <div class="related-item" data-jump="${idx}">
      <div class="related-thumb"><img src="works/images/${w.slug}/01.png" alt=""></div>
      <div class="related-title">${w.title}</div>
    </div>`).join('');
}

function slideHtml(w,i){
  const tagsHtml=w.tags.map(t=>`<span>${t}</span>`).join('');
  return `
    <div class="s-headgroup">
      <div class="s-hero"><img src="works/images/${w.slug}/01.png" alt=""></div>
      <h2 class="s-title">${w.title}</h2>
      <div class="s-meta">
        <p class="period">${w.period}</p>
        <div class="tags-row">${tagsHtml}</div>
      </div>
    </div>

    <div class="s-section">
      <p class="section-label">OVERVIEW</p>
      <p class="s-overview">${w.overview}</p>
    </div>

    ${w.design.length?`
    <div class="s-section">
      <p class="section-label">DESIGN</p>
      ${designHtml(w.design,i,w.hue,w.slug)}
    </div>`:''}

    ${w.process.length?`
    <div class="s-section">
      <p class="section-label">PROCESS</p>
      ${processHtml(w.process,i,w.hue,w.slug)}
    </div>`:''}

    ${w.outcome.length?`
    <div class="s-section">
      <p class="section-label">OUTCOME</p>
      ${outcomeHtml(w.outcome)}
    </div>`:''}

    <div class="s-divider"></div>
    <div class="s-section">
      <p class="section-label">関連作品</p>
      <div class="related-list">${relatedHtml(i)}</div>
    </div>
  `;
}

function buildSlides(){
  track.innerHTML = WORKS.map((w,i)=>`<section class="slide" data-i="${i}">${slideHtml(w,i)}</section>`).join('');
  track.querySelectorAll('.related-item').forEach(el=>{
    el.addEventListener('click',()=>setIndex(parseInt(el.dataset.jump,10)));
  });
}
buildSlides();

function buildDots(){
  dotsEl.innerHTML = WORKS.map((_,i)=>`<span class="dot${i===currentIndex?' is-active':''}"></span>`).join('');
}

function setIndex(i,{animate=true}={}){
  currentIndex=Math.max(0,Math.min(WORKS.length-1,i));
  measure();
  track.classList.toggle('is-animating',animate);
  track.style.transform=`translate3d(${-currentIndex*pagerWidth}px,0,0)`;
  caseLabel.textContent=`CASE 0${currentIndex+1} / 0${WORKS.length}`;
  caseTitle.textContent=WORKS[currentIndex].title;
  buildDots();
  // reset scroll on the focused slide
  const slide=track.children[currentIndex];
  if(slide) slide.scrollTop=0;
}

function openSheet(i){
  measure();
  setIndex(i,{animate:false});
  document.body.classList.add('sheet-open');
  sheet.setAttribute('aria-hidden','false');
}
function closeSheet(){
  document.body.classList.remove('sheet-open');
  sheet.setAttribute('aria-hidden','true');
}

prevBtn.addEventListener('click',()=>setIndex((currentIndex-1+WORKS.length)%WORKS.length));
nextBtn.addEventListener('click',()=>setIndex((currentIndex+1)%WORKS.length));
backdrop.addEventListener('click',closeSheet);

/* ============== Horizontal swipe (pager) ============== */
let hx=0,hy=0,hdx=0,hdy=0,hStartT=0,hDir=null,hDragging=false;
pager.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  hx=e.touches[0].clientX;hy=e.touches[0].clientY;hdx=0;hdy=0;hDir=null;hDragging=true;
  hStartT=performance.now();
  track.classList.remove('is-animating');
},{passive:true});
pager.addEventListener('touchmove',e=>{
  if(!hDragging)return;
  hdx=e.touches[0].clientX-hx;
  hdy=e.touches[0].clientY-hy;
  if(!hDir){
    if(Math.abs(hdx)>6||Math.abs(hdy)>6){
      hDir=Math.abs(hdx)>Math.abs(hdy)?'x':'y';
    }
  }
  if(hDir==='x'){
    e.preventDefault();
    let x=-currentIndex*pagerWidth+hdx;
    // resistance at edges
    if((currentIndex===0&&hdx>0)||(currentIndex===WORKS.length-1&&hdx<0)){
      x=-currentIndex*pagerWidth+hdx*0.35;
    }
    track.style.transform=`translate3d(${x}px,0,0)`;
  }
},{passive:false});
pager.addEventListener('touchend',()=>{
  if(!hDragging)return;hDragging=false;
  if(hDir!=='x'){return;}
  const dt=performance.now()-hStartT;
  const v=hdx/dt; // px/ms
  const threshold=pagerWidth*0.18;
  let next=currentIndex;
  if(hdx<-threshold || v<-0.4) next=currentIndex+1;
  else if(hdx>threshold || v>0.4) next=currentIndex-1;
  setIndex(next);
});

/* ============== Vertical drag (close sheet) — only on header/handle ============== */
let vy=0,vdy=0,vDragging=false,vStartT=0;
function onDragStart(y){
  vy=y;vdy=0;vDragging=true;vStartT=performance.now();
  document.body.classList.add('sheet-dragging');
}
function onDragMove(y){
  if(!vDragging)return;
  vdy=Math.max(0,y-vy);
  sheet.style.transform=`translateY(${vdy}px)`;
  backdrop.style.opacity=Math.max(0,1-vdy/400);
}
function onDragEnd(){
  if(!vDragging)return;vDragging=false;
  document.body.classList.remove('sheet-dragging');
  sheet.style.transform='';
  backdrop.style.opacity='';
  const dt=performance.now()-vStartT;
  const v=vdy/dt;
  if(vdy>140 || v>0.6) closeSheet();
}
sheetHead.addEventListener('touchstart',e=>{onDragStart(e.touches[0].clientY)},{passive:true});
sheetHead.addEventListener('touchmove',e=>{onDragMove(e.touches[0].clientY);e.preventDefault()},{passive:false});
sheetHead.addEventListener('touchend',onDragEnd);
sheetHead.addEventListener('mousedown',e=>{onDragStart(e.clientY);
  const mm=ev=>onDragMove(ev.clientY);
  const mu=()=>{onDragEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
});

/* desktop keyboard helpers */
window.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('sheet-open'))return;
  if(e.key==='ArrowRight') setIndex(currentIndex+1<WORKS.length?currentIndex+1:currentIndex);
  if(e.key==='ArrowLeft')  setIndex(currentIndex-1>=0?currentIndex-1:currentIndex);
  if(e.key==='Escape') closeSheet();
});

/* desktop: also allow mouse-drag swipe on pager */
let mDown=false,mx=0,mdx=0,mStartT=0;
pager.addEventListener('mousedown',e=>{
  mDown=true;mx=e.clientX;mdx=0;mStartT=performance.now();
  track.classList.remove('is-animating');
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!mDown)return;
  mdx=e.clientX-mx;
  let x=-currentIndex*pagerWidth+mdx;
  if((currentIndex===0&&mdx>0)||(currentIndex===WORKS.length-1&&mdx<0)) x=-currentIndex*pagerWidth+mdx*0.35;
  track.style.transform=`translate3d(${x}px,0,0)`;
});
window.addEventListener('mouseup',()=>{
  if(!mDown)return;mDown=false;
  const dt=performance.now()-mStartT;
  const v=mdx/dt;
  const threshold=pagerWidth*0.18;
  let next=currentIndex;
  if(mdx<-threshold || v<-0.4) next=currentIndex+1;
  else if(mdx>threshold || v>0.4) next=currentIndex-1;
  setIndex(next);
});

measure();
</script>
</body>
</html>
