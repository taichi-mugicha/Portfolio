<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Work Detail — Bottom Sheet Mock (A / B / C)</title>
<style>
  /* ===================================================================
     THEME TOKENS — switched by body[data-pattern="a|b|c"]
     Values read from Figma (Claude-Labo, mobile work-detail frames).
     =================================================================== */
  :root{
    --sheet-radius:22px;
    --ease:cubic-bezier(.22,1,.36,1);
    --slide-pad:22px;
  }
  body[data-pattern="a"]{
    --bg:#ffffff; --ink:#0a0a0a; --muted:#737373;
    --line:#e0e0e0; --line-soft:#f2f2f2; --ph:#ededed; --card:#f5f5f5;
    --card-radius:4px; --img-radius:0px; --backdrop:rgba(0,0,0,.36);
  }
  body[data-pattern="b"]{
    --bg:#faf8f2; --ink:#121212; --muted:#666157;
    --line:#d1ccc2; --line-soft:#e4dfd4; --ph:#ebe7dd; --card:#f3efe6;
    --card-radius:0px; --img-radius:0px; --backdrop:rgba(40,34,22,.40);
  }
  body[data-pattern="c"]{
    --bg:#ffffff; --ink:#141414; --muted:#6b6b6b;
    --line:#e6e6e6; --line-soft:#efefef; --ph:#ebebeb; --card:#fafafa;
    --card-radius:4px; --img-radius:0px; --backdrop:rgba(0,0,0,.34);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#cfcfcf;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    overflow:hidden;height:100%;width:100%;-webkit-font-smoothing:antialiased;
  }

  /* ===== TOP page ===== */
  .top{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transition:background .3s var(--ease)}
  .top__inner{max-width:430px;margin:0 auto;padding:14px 20px 120px}
  .nav{display:flex;align-items:center;justify-content:space-between;height:52px}
  .logo{font-weight:700;font-size:15px;letter-spacing:.2px;color:var(--ink)}
  .logo::before{content:"◼";margin-right:6px}
  .nav .right{font-size:13px;color:var(--ink)}
  .eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--muted);margin:28px 0 14px;font-weight:500}
  .hero-h{font-weight:700;font-size:38px;line-height:1.02;letter-spacing:-.02em;margin:0 0 26px;color:var(--ink)}
  body[data-pattern="b"] .hero-h{font-size:46px;letter-spacing:-.03em}
  .selected-row{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 14px;font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:500}

  .grid{display:grid;grid-template-columns:1fr;gap:28px}
  .card{cursor:pointer;user-select:none}
  .card__thumb{
    width:100%;aspect-ratio:4/3;background:var(--ph);border-radius:var(--card-radius);position:relative;overflow:hidden;
    transition:transform .25s var(--ease);
  }
  .card:active .card__thumb{transform:scale(.985)}
  .card__thumb svg{position:absolute;inset:0;width:100%;height:100%}
  .card__meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:8px}
  .card__title{font-weight:600;font-size:16px;color:var(--ink)}
  .card__tag{font-size:12px;color:var(--muted)}
  .card__num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ===== Pattern switcher (floating) ===== */
  .switcher{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:200;display:flex;gap:2px;padding:4px;
    background:rgba(20,20,20,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.28);
  }
  .switcher button{
    border:none;background:transparent;color:#cfcfcf;font:inherit;font-size:12px;font-weight:600;
    padding:8px 14px;border-radius:999px;cursor:pointer;letter-spacing:.2px;transition:.2s var(--ease);
  }
  .switcher button.is-on{background:#fff;color:#111}

  /* ===== Backdrop ===== */
  .backdrop{
    position:fixed;inset:0;background:var(--backdrop);
    opacity:0;pointer-events:none;transition:opacity .32s var(--ease);z-index:50;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  body.sheet-open .backdrop{opacity:1;pointer-events:auto}

  /* ===== Sheet ===== */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;height:96vh;background:var(--bg);
    border-top-left-radius:var(--sheet-radius);border-top-right-radius:var(--sheet-radius);
    box-shadow:0 -18px 60px rgba(0,0,0,.25);z-index:60;
    transform:translateY(100%);transition:transform .42s var(--ease);
    overflow:hidden;display:flex;flex-direction:column;will-change:transform;
    max-width:560px;margin:0 auto;
  }
  body.sheet-open .sheet{transform:translateY(0)}
  body.sheet-dragging .sheet{transition:none}
  body.sheet-dragging .backdrop{transition:none}

  .sheet__head{
    flex:0 0 auto;padding:10px 18px 6px;
    display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:2;touch-action:none;
  }
  .handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 8px;grid-column:1/-1}
  .sheet__title{font-weight:600;font-size:13px;text-align:center;letter-spacing:.2px;color:var(--ink)}
  .sheet__title small{display:block;font-weight:500;font-size:10px;letter-spacing:1.2px;color:var(--muted);margin-bottom:2px}
  .icon-btn{width:32px;height:32px;border:none;background:transparent;color:var(--ink);
    display:inline-flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
  .icon-btn:active{background:var(--line-soft)}

  .dots{display:flex;gap:5px;justify-content:center;padding:8px 0 4px;background:var(--bg)}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
  .dot.is-active{background:var(--ink);width:18px;border-radius:99px}

  .pager{flex:1 1 auto;position:relative;overflow:hidden;touch-action:pan-y;background:var(--bg)}
  .pager__track{position:absolute;inset:0;display:flex;will-change:transform}
  .pager__track.is-animating{transition:transform .38s var(--ease)}
  .slide{flex:0 0 100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--slide-pad) 90px}
  .slide::-webkit-scrollbar{display:none}

  .swipe-hint{
    position:absolute;left:50%;bottom:70px;transform:translateX(-50%);
    font-size:10.5px;color:var(--muted);letter-spacing:.6px;background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:7px 12px;border-radius:99px;border:1px solid var(--line);
    pointer-events:none;opacity:0;transition:opacity .35s var(--ease);z-index:3;
  }
  body.sheet-open .swipe-hint{opacity:1;animation:fadeOut .4s var(--ease) 2.8s forwards}
  @keyframes fadeOut{to{opacity:0}}

  /* ===================================================================
     SHARED slide atoms
     =================================================================== */
  .s-hero{width:100%;aspect-ratio:4/5;background:var(--ph);border-radius:var(--img-radius);overflow:hidden;margin:0 0 22px}
  .s-hero svg{width:100%;height:100%;display:block}
  .s-fig-img{width:100%;aspect-ratio:4/3;background:var(--ph);border-radius:var(--img-radius);overflow:hidden}
  .s-fig-img svg{width:100%;height:100%;display:block}
  .s-fig-cap{font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:500;margin:10px 0 26px}
  .s-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px;margin-top:30px;font-size:11px;color:var(--muted)}

  /* ============ PATTERN A — Grid Minimal ============ */
  .pa .s-eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:500;margin:18px 0 12px}
  .pa .s-title{font-size:44px;line-height:1;letter-spacing:-.88px;font-weight:700;margin:0 0 18px;color:var(--ink)}
  .pa .s-lede{font-size:15px;line-height:1.5;color:#404040;margin:0 0 24px}
  body[data-pattern="b"] .pa .s-lede{color:var(--muted)}
  .pa-meta{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 26px}
  .pa-meta .row{display:grid;grid-template-columns:120px 1fr;align-items:center;padding:15px 0;border-bottom:1px solid var(--line-soft)}
  .pa-meta .row:last-child{border-bottom:none}
  .pa-meta .k{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:500}
  .pa-meta .v{font-size:14px;color:var(--ink)}
  .pa .s-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:500;margin:34px 0 12px}
  .pa .s-h{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0 0 16px;color:var(--ink)}
  .pa .s-h.sm{font-size:20px}
  .pa .s-p{font-size:14px;line-height:1.65;color:var(--ink);margin:0 0 18px}
  .pa-gallery{display:grid;gap:14px;margin:0 0 8px}
  .pa-gallery figure{margin:0}
  .pa-gallery figcaption{font-size:11px;color:var(--muted);margin-top:10px}
  .pa-metrics{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 0 28px}
  .pa-metric{display:flex;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
  .pa-metric:last-child{border-bottom:none}
  .pa-metric .n{font-size:40px;font-weight:700;letter-spacing:-.8px;min-width:140px;color:var(--ink)}
  .pa-metric .l{font-size:13px;color:var(--muted)}
  .pa-next{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding:22px 0 4px;margin-top:8px}
  .pa-next small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:500;margin-bottom:8px}
  .pa-next b{font-weight:700;font-size:28px;color:var(--ink)}
  .pa-next .tag{font-size:12px;color:var(--muted);margin-top:4px}
  .pa-next .arrow{font-size:22px;color:var(--muted)}

  /* ============ PATTERN B — Editorial ============ */
  .pb .s-masthead{margin:18px 0 0}
  .pb .s-masthead div{font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:500;line-height:1.7}
  .pb .s-title{font-size:60px;line-height:.95;letter-spacing:-1.8px;font-weight:700;margin:18px 0 22px;color:var(--ink)}
  .pb .s-lede{font-size:17px;line-height:1.45;color:var(--ink);margin:0 0 26px}
  .pb .s-rule{height:1px;background:var(--line);margin:8px 0 22px}
  .pb .s-rule.ink{background:var(--ink)}
  .pb .s-sec-label{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:500;margin:26px 0 12px}
  .pb .s-h{font-size:32px;font-weight:700;line-height:1.05;letter-spacing:-.64px;margin:0 0 18px;color:var(--ink)}
  .pb .s-h.mid{font-size:28px;letter-spacing:-.56px;line-height:1.1}
  .pb .s-p{font-size:14px;line-height:1.7;color:var(--ink);margin:0 0 22px}
  .pb-quote{margin:6px 0 22px}
  .pb-quote .q{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.36px;color:var(--ink);margin:0 0 14px}
  .pb-quote .by{font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:500}
  .pb-metric{display:flex;align-items:baseline;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
  .pb-metric .n{font-size:36px;font-weight:700;letter-spacing:-.72px;min-width:150px;color:var(--ink)}
  .pb-metric .l{font-size:13px;color:var(--ink)}
  .pb-next{margin:26px 0 0}
  .pb-next .lab{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:500;margin-bottom:14px}
  .pb-next b{font-size:30px;font-weight:700;color:var(--ink);display:block}
  .pb-next .tag{font-size:12px;color:var(--muted);margin-top:6px}
  .pb-cta{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1.32px;color:var(--ink);margin:30px 0 16px}
  .pb-cta-mail{font-size:15px;color:var(--ink)}

  /* ============ PATTERN C — Technical ============ */
  .pc .s-eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:500;margin:18px 0 12px}
  .pc .s-title{font-size:40px;line-height:1.05;letter-spacing:-.8px;font-weight:700;margin:0 0 24px;color:var(--ink)}
  .pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:0 0 22px;border-bottom:1px solid var(--line);margin:0 0 24px}
  .pc-meta .k{font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:500;margin-bottom:7px}
  .pc-meta .v{font-size:13px;font-weight:500;color:var(--ink)}
  .pc .s-numlabel{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:500;margin:30px 0 12px}
  .pc .s-h{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.22px;margin:0 0 16px;color:var(--ink)}
  .pc .s-p{font-size:14px;line-height:1.75;color:var(--ink);margin:0 0 22px}
  .pc-points{margin:0 0 8px}
  .pc-point{padding:18px 0;border-bottom:1px solid var(--line)}
  .pc-point .i{font-size:11px;color:var(--muted)}
  .pc-point .t{font-size:16px;font-weight:600;margin:6px 0 6px;color:var(--ink)}
  .pc-point .d{font-size:13px;color:var(--ink);line-height:1.7}
  .pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 22px}
  .pc-stat{background:var(--card);border-radius:4px;padding:18px 16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
  .pc-stat .n{font-size:28px;font-weight:700;letter-spacing:-.56px;color:var(--ink)}
  .pc-stat .l{font-size:11px;color:var(--muted);line-height:1.45}
  .pc-credits{font-size:12px;line-height:1.7;color:var(--muted);margin:6px 0 0}
  .pc-nextcard{background:var(--card);border-radius:4px;padding:24px 22px;margin:14px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .pc-nextcard b{font-size:26px;font-weight:700;letter-spacing:-.39px;color:var(--ink);display:block}
  .pc-nextcard .d{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;max-width:260px}
  .pc-nextcard .arrow{font-size:20px;color:var(--ink)}

  /* ===================================================================
     TOP PAGE — per pattern (A reuses .nav/.hero-h/.grid/.card above)
     =================================================================== */
  /* ---- TOP B : Editorial ---- */
  .tb-nav{display:flex;justify-content:space-between;align-items:center;height:52px;font-size:12px;color:var(--ink)}
  .tb-nav strong{font-weight:600;letter-spacing:.4px}
  .tb-masthead{padding:18px 0 8px}
  .tb-issue{font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:500;margin-bottom:16px}
  .tb-stmt{font-size:46px;line-height:.96;letter-spacing:-.03em;font-weight:700;margin:0 0 18px;color:var(--ink)}
  .tb-bio{font-size:14px;line-height:1.5;color:var(--ink);margin:0;max-width:320px}
  .tb-rule{height:1px;background:var(--line);margin:24px 0}
  .tb-featlabel{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin:0 0 16px}
  .tb-feat{cursor:pointer;user-select:none}
  .tb-feat-img{aspect-ratio:4/3;background:var(--ph);overflow:hidden;margin-bottom:16px}
  .tb-feat-img svg{width:100%;height:100%;display:block}
  .tb-feat:active .tb-feat-img{opacity:.9}
  .tb-feat h3{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink)}
  .tb-feat p{font-size:14px;line-height:1.5;color:var(--ink);margin:0 0 14px}
  .tb-feat .tags{display:flex;gap:6px;margin-bottom:16px}
  .tb-feat .tag{border:1px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:10px;color:var(--ink)}
  .tb-btn{display:inline-block;background:var(--ink);color:var(--bg);padding:11px 18px;font-size:12px}
  .tb-listlabel{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin:0}
  .tb-list{border-top:1px solid var(--ink);margin-top:14px}
  .tb-row{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .tb-row:active{opacity:.6}
  .tb-row .num{font-size:16px;font-weight:700;width:26px;color:var(--ink)}
  .tb-row .body{flex:1}
  .tb-row .nm{font-size:16px;font-weight:600;color:var(--ink)}
  .tb-row .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .tb-row .yr{font-size:11px;color:var(--muted)}
  .tb-cta{padding:50px 0 0}
  .tb-cta h2{font-size:42px;line-height:1;letter-spacing:-.03em;font-weight:700;margin:10px 0;color:var(--ink)}
  .tb-cta strong{font-size:15px;color:var(--ink)}
  .tb-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:26px;padding-top:20px;font-size:10px;color:var(--muted)}

  /* ---- TOP C : Sidebar folded ---- */
  .tc-top{display:flex;justify-content:space-between;align-items:center;height:52px}
  .tc-top .logo{font-weight:700;font-size:15px;color:var(--ink)}
  .tc-top .logo::before{content:"◼";margin-right:6px}
  .tc-top .right{font-size:13px;color:var(--ink)}
  .tc-bio{background:var(--card);border-radius:var(--card-radius);padding:24px 20px;margin:8px 0 24px}
  .tc-avatar{width:56px;height:56px;border-radius:999px;background:var(--ph);margin-bottom:14px}
  .tc-bio h3{font-size:20px;margin:0 0 10px;color:var(--ink)}
  .tc-bio p{font-size:13px;color:var(--ink);margin:0 0 12px;line-height:1.5}
  .tc-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
  .tc-status .dot{width:8px;height:8px;border-radius:999px;background:var(--ink)}
  .tc-hero h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:700;margin:14px 0 0;color:var(--ink)}
  .tc-meta{display:flex;flex-wrap:wrap;gap:18px 28px;margin:22px 0 6px}
  .tc-meta .k{font-size:10px;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .tc-meta p{font-size:12px;color:var(--ink);margin:0;line-height:1.55}
  .tc-cases{margin-top:8px}
  .tc-case{padding:28px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
  .tc-case:active{opacity:.7}
  .tc-case .crow{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.6px;color:var(--muted);margin-bottom:14px;text-transform:uppercase}
  .tc-case-img{aspect-ratio:16/10;background:var(--ph);border-radius:var(--card-radius);overflow:hidden;margin-bottom:14px}
  .tc-case-img svg{width:100%;height:100%;display:block}
  .tc-case h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;color:var(--ink)}
  .tc-case p{font-size:13px;color:var(--ink);margin:0 0 10px;line-height:1.6}
  .tc-case .read{font-size:12px;font-weight:600;color:var(--ink)}
  .tc-finalcta{padding:40px 0 0;border-top:1px solid var(--line);margin-top:8px}
  .tc-finalcta h2{font-size:34px;line-height:1.02;letter-spacing:-.03em;font-weight:700;margin:10px 0 18px;color:var(--ink)}
  .tc-finalcta .btns{display:flex;gap:10px}
  .tc-btn{background:var(--ink);color:var(--bg);padding:11px 18px;font-size:13px}
  .tc-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .tc-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:26px;padding-top:20px;font-size:10px;color:var(--muted)}
</style>
</head>
<body data-pattern="a">

<!-- ============ TOP ============ -->
<div class="top" id="top">
  <div class="top__inner" id="topInner"></div>
</div>

<!-- ============ Switcher ============ -->
<div class="switcher" id="switcher">
  <button data-p="a" class="is-on">A · Grid</button>
  <button data-p="b">B · Editorial</button>
  <button data-p="c">C · Sidebar</button>
</div>

<!-- ============ Backdrop ============ -->
<div class="backdrop" id="backdrop"></div>

<!-- ============ Sheet ============ -->
<div class="sheet" id="sheet" aria-hidden="true" role="dialog">
  <div class="sheet__head" id="sheetHead">
    <div class="handle"></div>
    <button class="icon-btn" id="prevBtn" aria-label="prev">‹</button>
    <div class="sheet__title">
      <small id="caseLabel">CASE 01 / 06</small>
      <span id="caseTitle">—</span>
    </div>

  return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="${c1}"/>
    <rect x="0" y="${60+seed*8}" width="400" height="${100-seed*6}" fill="${c2}"/>
    <circle cx="${80+seed*40}" cy="${180-seed*10}" r="${44+seed*4}" fill="${c3}" opacity=".82"/>
    <rect x="${220-seed*10}" y="${40+seed*6}" width="${120+seed*6}" height="${120+seed*4}" fill="${c3}" opacity=".55"/>
  </svg>`;
}

    <h3 class="s-h">どう解いたか。</h3>
    <p class="s-p">${w.process}</p>
    <div class="pc-points">${pts}</div>

    <p class="s-numlabel">03  —  デザイン</p>
    <h3 class="s-h">画面と、その細部。</h3>
    <div class="s-fig-img">${thumbSvg(w.hue,i+1)}</div>
    <p class="s-fig-cap">FIG. 02  —  主要画面</p>

    <p class="s-numlabel">04  —  成果</p>
    <h3 class="s-h">摩擦を減らし、信頼を。</h3>
    <div class="pc-stats">${stats}</div>
    <p class="pc-credits">Credits — 伊藤太一（${w.meta.Role}）／ ${w.meta.Client}</p>

    <p class="s-numlabel">NEXT  →</p>
    <div class="pc-nextcard">
      <div><b>${next.title}</b><div class="d">${next.lede}</div></div>
      <div class="arrow">→</div>
    </div>
    <div class="s-foot"><span>伊藤太一 — Taichi Ito</span><span>© 2025</span></div>
  `;
}

const TEMPLATES={a:slideA,b:slideB,c:slideC};
const SLIDECLASS={a:'pa',b:'pb',c:'pc'};
let pattern='a';

/* ===================== SHEET / PAGER ===================== */
const sheet=document.getElementById('sheet');
const backdrop=document.getElementById('backdrop');
const closeBtn=document.getElementById('closeBtn');
const prevBtn=document.getElementById('prevBtn');
const sheetHead=document.getElementById('sheetHead');
const pager=document.getElementById('pager');
const track=document.getElementById('track');
const caseLabel=document.getElementById('caseLabel');
const caseTitle=document.getElementById('caseTitle');
const dotsEl=document.getElementById('dots');

let currentIndex=0, pagerWidth=0;
function measure(){pagerWidth=pager.clientWidth}
window.addEventListener('resize',()=>{measure();setIndex(currentIndex,{animate:false})});

function buildSlides(){
  const tpl=TEMPLATES[pattern], cls=SLIDECLASS[pattern];
  track.innerHTML=WORKS.map((w,i)=>`<section class="slide ${cls}" data-i="${i}">${tpl(w,i)}</section>`).join('');
}
function buildDots(){
  dotsEl.innerHTML=WORKS.map((_,i)=>`<span class="dot${i===currentIndex?' is-active':''}"></span>`).join('');
}
function setIndex(i,{animate=true}={}){
  currentIndex=Math.max(0,Math.min(WORKS.length-1,i));
  measure();
  track.classList.toggle('is-animating',animate);
  track.style.transform=`translate3d(${-currentIndex*pagerWidth}px,0,0)`;
  caseLabel.textContent=`CASE 0${currentIndex+1} / 0${WORKS.length}`;
  caseTitle.textContent=WORKS[currentIndex].title;
  buildDots();
  const slide=track.children[currentIndex];
  if(slide) slide.scrollTop=0;
}
function openSheet(i){
  measure(); buildSlides(); setIndex(i,{animate:false});
  document.body.classList.add('sheet-open');
  sheet.setAttribute('aria-hidden','false');
}
function closeSheet(){
  document.body.classList.remove('sheet-open');
  sheet.setAttribute('aria-hidden','true');
}
closeBtn.addEventListener('click',closeSheet);
prevBtn.addEventListener('click',()=>setIndex((currentIndex-1+WORKS.length)%WORKS.length));
backdrop.addEventListener('click',closeSheet);

/* ===================== Pattern switcher ===================== */
const switcher=document.getElementById('switcher');
switcher.addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn)return;
  pattern=btn.dataset.p;
  document.body.dataset.pattern=pattern;
  [...switcher.children].forEach(b=>b.classList.toggle('is-on',b===btn));
  renderTop();                              // swap TOP layout to match pattern
  buildSlides(); setIndex(currentIndex,{animate:false});  // keep sheet in sync
});

/* ===================== Horizontal swipe ===================== */
let hx=0,hy=0,hdx=0,hdy=0,hStartT=0,hDir=null,hDragging=false;
pager.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  hx=e.touches[0].clientX;hy=e.touches[0].clientY;hdx=0;hdy=0;hDir=null;hDragging=true;
  hStartT=performance.now();track.classList.remove('is-animating');
},{passive:true});
pager.addEventListener('touchmove',e=>{
  if(!hDragging)return;
  hdx=e.touches[0].clientX-hx;hdy=e.touches[0].clientY-hy;
  if(!hDir){ if(Math.abs(hdx)>6||Math.abs(hdy)>6){hDir=Math.abs(hdx)>Math.abs(hdy)?'x':'y';} }
  if(hDir==='x'){
    e.preventDefault();
    let x=-currentIndex*pagerWidth+hdx;
    if((currentIndex===0&&hdx>0)||(currentIndex===WORKS.length-1&&hdx<0)) x=-currentIndex*pagerWidth+hdx*0.35;
    track.style.transform=`translate3d(${x}px,0,0)`;
  }
},{passive:false});
pager.addEventListener('touchend',()=>{
  if(!hDragging)return;hDragging=false;
  if(hDir!=='x')return;
  const dt=performance.now()-hStartT, v=hdx/dt, threshold=pagerWidth*0.18;
  let next=currentIndex;
  if(hdx<-threshold||v<-0.4) next=currentIndex+1;
  else if(hdx>threshold||v>0.4) next=currentIndex-1;
  setIndex(next);
});

/* ===================== Vertical drag to close ===================== */
let vy=0,vdy=0,vDragging=false,vStartT=0;
function onDragStart(y){vy=y;vdy=0;vDragging=true;vStartT=performance.now();document.body.classList.add('sheet-dragging')}
function onDragMove(y){if(!vDragging)return;vdy=Math.max(0,y-vy);sheet.style.transform=`translateY(${vdy}px)`;backdrop.style.opacity=Math.max(0,1-vdy/400)}
function onDragEnd(){
  if(!vDragging)return;vDragging=false;document.body.classList.remove('sheet-dragging');
  sheet.style.transform='';backdrop.style.opacity='';
  const dt=performance.now()-vStartT, v=vdy/dt;
  if(vdy>140||v>0.6) closeSheet();
}
sheetHead.addEventListener('touchstart',e=>onDragStart(e.touches[0].clientY),{passive:true});
sheetHead.addEventListener('touchmove',e=>{onDragMove(e.touches[0].clientY);e.preventDefault()},{passive:false});
sheetHead.addEventListener('touchend',onDragEnd);
sheetHead.addEventListener('mousedown',e=>{onDragStart(e.clientY);
  const mm=ev=>onDragMove(ev.clientY);
  const mu=()=>{onDragEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
});

/* ===================== Keyboard ===================== */
window.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('sheet-open'))return;
  if(e.key==='ArrowRight') setIndex(currentIndex+1<WORKS.length?currentIndex+1:currentIndex);
  if(e.key==='ArrowLeft')  setIndex(currentIndex-1>=0?currentIndex-1:currentIndex);
  if(e.key==='Escape') closeSheet();
});

/* ===================== Desktop mouse-drag swipe ===================== */
let mDown=false,mx=0,mdx=0,mStartT=0;
pager.addEventListener('mousedown',e=>{mDown=true;mx=e.clientX;mdx=0;mStartT=performance.now();track.classList.remove('is-animating');e.preventDefault()});
window.addEventListener('mousemove',e=>{
  if(!mDown)return;mdx=e.clientX-mx;
  let x=-currentIndex*pagerWidth+mdx;
  if((currentIndex===0&&mdx>0)||(currentIndex===WORKS.length-1&&mdx<0)) x=-currentIndex*pagerWidth+mdx*0.35;
  track.style.transform=`translate3d(${x}px,0,0)`;
});
window.addEventListener('mouseup',()=>{
  if(!mDown)return;mDown=false;
  const dt=performance.now()-mStartT, v=mdx/dt, threshold=pagerWidth*0.18;
  let next=currentIndex;
  if(mdx<-threshold||v<-0.4) next=currentIndex+1;
  else if(mdx>threshold||v>0.4) next=currentIndex-1;
  setIndex(next);
});

renderTop();
buildSlides();
measure();
</script>
</body>
</html>
