/* ===================== レンダリング ===================== */
function getIndex(){
  const p = new URLSearchParams(location.search).get('w');
  const i = parseInt(p,10);
  return (Number.isInteger(i) && i>=0 && i<WORKS.length) ? i : 0;
}
function n2(i){return String(i+1).padStart(2,'0');}

function render(){
  const i = getIndex();
  const w = WORKS[i];
  const prev = (i-1+WORKS.length)%WORKS.length;
  const next = (i+1)%WORKS.length;
  document.title = `${w.title} — 作品詳細`;

  const overviewHtml = w.overview.map(p=>`<p>${p}</p>`).join('');
  const rolesHtml = w.roles.map(r=>`<li>${r}</li>`).join('');
  const solHtml = w.solutions.map(s=>`<figure class="detail-figure"><span class="ph"></span><figcaption>${s}</figcaption></figure>`).join('');
  const outHtml = w.outcomes.map(o=>`<li>${o}</li>`).join('');
  const calloutHtml = w.callout ? `<div class="detail-callout">${w.callout}</div>` : '';

  document.getElementById('detailRoot').innerHTML = `
    <div class="detail-breadcrumb">
      <a href="index.html">Index</a><span>/</span>
      <a href="pattern-a.html">実績</a><span>/</span>
      <span>${w.title}</span>
    </div>

    <header class="detail-head">
      <div class="eyebrow">Case Study · ${n2(i)}</div>
      <h1>${w.title}</h1>
      <p class="summary">${w.summary}</p>
    </header>

      <div class="cell"><div class="k">担当</div><div class="v">${w.role}</div></div>
      <div class="cell"><div class="k">期間</div><div class="v">${w.year}</div></div>
      <div class="cell"><div class="k">プラットフォーム</div><div class="v">${w.platform}</div></div>
      <div class="cell"><div class="k">クライアント</div><div class="v">${w.client}</div></div>
    </section>

    <section class="detail-section">
      <h2>概要</h2>
      ${overviewHtml}
    </section>

    <section class="detail-section">
      <h2>課題</h2>
      <p>${w.challenge}</p>
      ${calloutHtml}
    </section>

    <section class="detail-section">
      <h2>担当</h2>
      <ul>${rolesHtml}</ul>
    </section>

    <section class="detail-section">
      <h2>解決策</h2>

    </div>
  `;

    <a class="home" href="index.html">← Index</a>
    <a href="pattern-a.html">← 実績一覧へ戻る</a>
    <a href="work-detail.html?w=${next}">Next：${WORKS[next].title} →</a>
  `;
}
render();
window.addEventListener('popstate', render);
</script>
